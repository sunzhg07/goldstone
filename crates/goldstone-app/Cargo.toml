[package]
name = "goldstone-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = "0.37"
egui = "0.37"
goldstone-core = { version = "0.3.1", path = "../goldstone-core" }
goldstone-export = { version = "0.3.1", path = "../goldstone-export" }
rfd = "0.18"
serde_json = "1"
toml = "1"

[dev-dependencies]
goldstone-export = { version = "0.3.1", path = "../goldstone-export" }
image = { version = "0.25", default-features = false, features = ["png"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }

# Screen color picker: the system's own picker where there is one.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSColor", "NSColorSampler", "NSColorSpace"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

# The web version (WebAssembly in the browser).
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", features = ["glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "Blob", "BlobPropertyBag", "Url", "Storage", "Navigator", "Response", "BeforeUnloadEvent", "Event"] }
